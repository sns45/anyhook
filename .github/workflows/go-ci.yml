name: Go CI

on:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  go-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # No go.sum: this module has zero external dependencies (core,
          # signing, and testing are all stdlib-only), so cache on go.mod instead.
          cache-dependency-path: go/go.mod

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
