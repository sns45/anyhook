# Deployable anyhook Worker template. Copy into your project and adjust names/routes.
# anyhook does NOT authenticate end customers (G8): put your own auth (e.g. auth-gateway) in front.
name = "anyhook"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Delivery transport (Cloudflare Queues). Producer + consumer bound to the same queue.
[[queues.producers]]
queue = "anyhook-deliveries"
binding = "QUEUE"

[[queues.consumers]]
queue = "anyhook-deliveries"
max_batch_size = 10
max_retries = 5

# Durable Object state (D3: one DO per endpoint, one index DO per tenant).
[[durable_objects.bindings]]
name = "TENANT_INDEX"
class_name = "TenantIndexDurableObject"

[[durable_objects.bindings]]
name = "ENDPOINT"
class_name = "EndpointDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["TenantIndexDurableObject", "EndpointDurableObject"]
